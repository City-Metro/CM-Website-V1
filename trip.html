<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Your journey | City Metro Transit</title><meta name="description" content="Plan a trip on City Metro and compare the fastest, fewest transfers and least walking routes.">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="https://alerts.citymetro.xyz/logo.png" type="image/png">
</head><body>
<div id="site-header"></div>
<main>
<div class="container">
<nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a> &nbsp;&gt;&nbsp; <strong>Trip planner</strong></nav>
<h1 class="about-title">Your journey</h1>
<section class="hub-panel plan-panel trip-form-panel" aria-label="Plan a trip">
<form class="hub-body" id="plan-form" action="/trip" method="get" autocomplete="off">
<label class="field"><span>From</span><input name="from" placeholder="Station or stop" required></label>
<button type="button" class="swap" id="plan-swap" aria-label="Swap from and to"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg></button>
<label class="field"><span>To</span><input name="to" placeholder="Station or stop" required></label>
<label class="pref"><span>Travel preference</span><select name="mode"><option value="fastest">Fastest</option><option value="fewest_transfers">Fewest transfers</option><option value="fewest_walking">Least walking</option></select></label>
<button class="btn-light" type="submit">Plan My Trip</button>
<datalist id="station-list"></datalist>
</form>
</section>
<div id="trip-results" aria-live="polite"><p class="st-msg">Loading…</p></div>
<noscript><p class="st-msg">Turn on JavaScript to see your journey, or use the <a href="https://trip-planner.citymetro.xyz">full Trip Planner</a>.</p></noscript>
<p class="end"><a class="btn ghost" href="https://trip-planner.citymetro.xyz">Open the full Trip Planner map</a></p>
<div class="end-space"></div>
</div>
</main>
<div id="site-footer"></div>
<script src="/site.js"></script>
<script src="/transit.js" defer></script>
</body></html>
